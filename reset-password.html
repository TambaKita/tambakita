<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - TambaKita</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1e40af, #1e3a8a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 32px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #dbeafe;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon i { font-size: 40px; color: #2563eb; }
    h1 { font-size: 28px; font-weight: 900; margin-bottom: 8px; color: #1e293b; }
    .sub { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    input {
      width: 100%;
      padding: 16px;
      background: #f8fafc;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { ring: 2px solid #2563eb; background: white; }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: 900;
      font-size: 16px;
      margin-top: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .error { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 16px; font-size: 12px; margin-bottom: 16px; }
    .success { background: #dcfce7; color: #16a34a; padding: 12px; border-radius: 16px; font-size: 12px; margin-bottom: 16px; }
    .footer { margin-top: 24px; font-size: 12px; color: #94a3b8; }
    a { color: #2563eb; text-decoration: none; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="card">
  <div class="icon">
    <i class="fas fa-lock"></i>
  </div>
  <h1>Reset Password</h1>
  <p class="sub">Masukkan password baru Anda</p>

  <div id="errorMsg" class="error" style="display: none;"></div>
  <div id="successMsg" class="success" style="display: none;"></div>

  <input type="password" id="password" placeholder="Password Baru (min 6 karakter)">
  <input type="password" id="confirmPassword" placeholder="Konfirmasi Password">

  <button id="resetBtn">Update Password</button>
  <div class="footer">
    <a href="/tambakita/">← Kembali ke Login</a>
  </div>
</div>

<script>
  // Ambil token dari URL hash (format Supabase)
  const hash = window.location.hash;
  let accessToken = null;
  
  if (hash && hash.includes('access_token=')) {
    const match = hash.match(/access_token=([^&]+)/);
    if (match) accessToken = match[1];
  }
  
  console.log('Token:', accessToken);
  
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const errorDiv = document.getElementById('errorMsg');
    const successDiv = document.getElementById('successMsg');
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    if (!password || !confirm) {
      errorDiv.textContent = 'Lengkapi semua field!';
      errorDiv.style.display = 'block';
      return;
    }
    
    if (password !== confirm) {
      errorDiv.textContent = 'Password tidak cocok!';
      errorDiv.style.display = 'block';
      return;
    }
    
    if (password.length < 6) {
      errorDiv.textContent = 'Password minimal 6 karakter!';
      errorDiv.style.display = 'block';
      return;
    }
    
    try {
      // Panggil Supabase langsung
      const supabaseUrl = 'https://vicrovuxofsfzgofvmgc.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpY3JvdnV4b2ZzZnpnb2Z2bWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ1Mjg1NjMsImV4cCI6MjA2MDEwNDU2M30.8zJh3sTZYXwYmqX_pE_yQ_rGLYL06Qn5ANF4ryML2Gk';
      
      const response = await fetch(`${supabaseUrl}/auth/v1/user`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'apikey': supabaseKey,
          'Authorization': `Bearer ${accessToken}`
        },
        body: JSON.stringify({ password: password })
      });
      
      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.msg || 'Gagal update password');
      }
      
      successDiv.textContent = '✅ Password berhasil direset! Mengalihkan ke login...';
      successDiv.style.display = 'block';
      
      setTimeout(() => {
        window.location.href = '/tambakita/';
      }, 2000);
      
    } catch (err) {
      errorDiv.textContent = err.message || 'Token tidak valid atau sudah kadaluarsa. Minta link baru.';
      errorDiv.style.display = 'block';
    }
  });
</script>
</body>
</html>
