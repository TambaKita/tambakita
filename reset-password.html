<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - TambaKita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-600 to-blue-800 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl text-center">
    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-lock text-blue-600 text-3xl"></i</div>
    <h1 class="text-2xl font-black text-slate-800 mb-2">Reset Password</h1>
    <p class="text-slate-500 text-sm mb-6">Masukkan password baru Anda.</p>

    <div id="errorMsg" class="bg-red-50 text-red-600 p-3 rounded-xl text-sm hidden mb-4"></div>
    <div id="successMsg" class="bg-green-50 text-green-600 p-3 rounded-xl text-sm hidden mb-4"></div>

    <input type="password" id="password" placeholder="Password Baru (min. 6 karakter)" class="w-full p-4 bg-slate-50 rounded-2xl border-none text-sm font-bold outline-none focus:ring-2 focus:ring-blue-200 mb-4">
    <input type="password" id="confirmPassword" placeholder="Konfirmasi Password" class="w-full p-4 bg-slate-50 rounded-2xl border-none text-sm font-bold outline-none focus:ring-2 focus:ring-blue-200 mb-6">

    <button id="resetBtn" class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-2xl font-black text-sm uppercase shadow-xl active:scale-95 transition-all">Update Password</button>
    <div class="mt-6 text-xs text-slate-400"><a href="/tambakita/" class="text-blue-600">← Kembali ke Login</a></div>
  </div>

  <script>
    const resetBtn = document.getElementById('resetBtn');
    const errorDiv = document.getElementById('errorMsg');
    const successDiv = document.getElementById('successMsg');

    // Fungsi untuk mengambil parameter dari URL hash (contoh: #access_token=...)
    const getHashParam = (param) => {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get(param);
    };

    const accessToken = getHashParam('access_token');
    const refreshToken = getHashParam('refresh_token');
    const type = getHashParam('type');

    console.log('Token ditemukan:', !!accessToken, 'Type:', type);

    if (!accessToken || type !== 'recovery') {
      errorDiv.innerText = 'Link reset password tidak valid atau sudah kadaluarsa. Silakan minta link baru.';
      errorDiv.classList.remove('hidden');
      resetBtn.disabled = true;
    }

    resetBtn.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      if (!password || !confirm) {
        errorDiv.innerText = 'Harap isi semua kolom.';
        errorDiv.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        errorDiv.innerText = 'Password dan konfirmasi tidak cocok.';
        errorDiv.classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        errorDiv.innerText = 'Password minimal 6 karakter.';
        errorDiv.classList.remove('hidden');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerText = 'Memproses...';

      try {
        // Update password menggunakan token yang didapat dari URL
        const response = await fetch(`https://vicrovuxofsfzgofvmgc.supabase.co/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpY3JvdnV4b2ZzZnpnb2Z2bWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ1Mjg1NjMsImV4cCI6MjA2MDEwNDU2M30.8zJh3sTZYXwYmqX_pE_yQ_rGLYL06Qn5ANF4ryML2Gk',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({ password: password })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.msg || 'Token tidak valid atau sudah kadaluarsa.');
        }

        successDiv.innerText = '✅ Password berhasil diubah! Mengalihkan ke halaman login...';
        successDiv.classList.remove('hidden');
        
        setTimeout(() => {
          window.location.href = '/tambakita/';
        }, 2000);

      } catch (error) {
        console.error(error);
        errorDiv.innerText = error.message;
        errorDiv.classList.remove('hidden');
        resetBtn.disabled = false;
        resetBtn.innerText = 'Update Password';
      }
    });
  </script>
</body>
</html>
